[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[A-Za-z0-9\-_]{20,}'''
tags = ["anthropic"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["openai"]

[[rules]]
id = "google-api-key"
description = "Google API Key (Gemini, Maps, etc.)"
regex = '''AIzaSy[A-Za-z0-9\-_]{33}'''
tags = ["google"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot Token"
regex = '''\d{8,10}:AA[A-Za-z0-9\-_]{33}'''
tags = ["telegram"]

[[rules]]
id = "github-token"
description = "GitHub Token"
regex = '''(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}'''
tags = ["github"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key"]

[[rules]]
id = "notion-api-key"
description = "Notion API Key (legacy secret_ and current ntn_ formats)"
regex = '''(secret_[A-Za-z0-9]{43}|ntn_[A-Za-z0-9]{40,50})'''
tags = ["notion"]

[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[A-Za-z0-9\-]{10,}'''
tags = ["slack"]

[[rules]]
id = "stripe-api-key"
description = "Stripe API Key"
regex = '''sk_(live|test)_[A-Za-z0-9]{24,}'''
tags = ["stripe"]

[[rules]]
id = "generic-bearer-token"
description = "Hardcoded Bearer token in an Authorization header"
regex = '''(?i)authorization["']?\s*[:=]\s*["']?Bearer\s+[A-Za-z0-9\-_.]{20,}'''
tags = ["generic", "bearer"]

[[rules]]
id = "google-service-account-key-id"
description = "Google service account private_key_id field"
regex = '''"private_key_id"\s*:\s*"[a-f0-9]{40}"'''
tags = ["google", "service-account"]
